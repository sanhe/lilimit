name: release-linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "lilimit-v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publishing the draft release created by a workflow_dispatch run pushes its
  # lilimit-v* tag, which matches this workflow's own tag triggers and would
  # build a duplicate release. Skip tag pushes whose release already exists.
  guard:
    name: guard against release re-runs
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.release-exists.outputs.skip }}
    steps:
      - name: Check for an existing release
        id: release-exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          skip=false
          if [ "${{ github.ref_type }}" = "tag" ] && gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            skip=true
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

  ubuntu:
    name: ubuntu packages
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload Ubuntu artifacts
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles deb,appimage
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'lilimit-v__VERSION__' }}
          releaseName: lilimit v__VERSION__
          releaseBody: |
            Ubuntu packages for lilimit.

            Prefer the `.deb` on Ubuntu. Use the AppImage when you want a portable fallback.
          releaseDraft: true
          prerelease: false

      - name: Upload Ubuntu workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lilimit-ubuntu-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          compression-level: 0
